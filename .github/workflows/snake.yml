# Genera la serpiente que se "come" tus contribuciones.
# Se ejecuta cada día y la publica en la rama "output" de este repo.
name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"   # todos los días a medianoche (UTC)
  workflow_dispatch:       # botón "Run workflow" para lanzarla a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#845EC2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6FDA44

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
