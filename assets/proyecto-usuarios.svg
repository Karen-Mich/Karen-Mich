<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.anim{transform-box:fill-box;transform-origin:center}
@keyframes req{0%,15%{opacity:0;transform:translate(-14px,0px)}19%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(-14px,0px)}}
@keyframes res{0%,23%{opacity:0;transform:translate(14px,0px)}27%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(14px,0px)}}
.req{animation:req 10s ease-out infinite}.res{animation:res 10s ease-out infinite}
@keyframes u0{0%,32%{opacity:0;transform:translate(0px,14px)}36%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(0px,14px)}}
.u0{animation:u0 10s ease-out infinite}
@keyframes u1{0%,38%{opacity:0;transform:translate(0px,14px)}42%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(0px,14px)}}
.u1{animation:u1 10s ease-out infinite}
@keyframes u2{0%,44%{opacity:0;transform:translate(0px,14px)}48%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(0px,14px)}}
.u2{animation:u2 10s ease-out infinite}
@keyframes u3{0%,50%{opacity:0;transform:translate(0px,14px)}54%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(0px,14px)}}
.u3{animation:u3 10s ease-out infinite}
@keyframes press{0%,12%{transform:scale(1)}13.5%{transform:scale(.93)}15%,100%{transform:scale(1)}}.press{animation:press 10s ease-out infinite}
</style>

