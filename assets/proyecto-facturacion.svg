<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes r0{0%,8%{opacity:0;transform:translate(-24px,0px)}12%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(-24px,0px)}}
@keyframes r1{0%,16%{opacity:0;transform:translate(-24px,0px)}20%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(-24px,0px)}}
@keyframes r2{0%,24%{opacity:0;transform:translate(-24px,0px)}28%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(-24px,0px)}}
@keyframes r3{0%,32%{opacity:0;transform:translate(-24px,0px)}36%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(-24px,0px)}}
@keyframes tot{0%,44%{opacity:0;transform:translate(0px,12px)}48%,88%{opacity:1;transform:translate(0px,0px) scale(1)}92%,100%{opacity:0;transform:translate(0px,12px)}}
@keyframes stamp{0%,58%{opacity:0;transform:scale(2.6)}64%{opacity:1;transform:scale(.92)}68%,88%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}
.anim{transform-box:fill-box;transform-origin:center}
.r0{animation:r0 9s ease-out infinite}.r1{animation:r1 9s ease-out infinite}.r2{animation:r2 9s ease-out infinite}.r3{animation:r3 9s ease-out infinite}.tot{animation:tot 9s ease-out infinite}.stamp{animation:stamp 9s ease-out infinite}</style>

